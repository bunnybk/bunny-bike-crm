<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bunny Bike CRM</title>
<style>
:root{--bg:#101319;--panel:#191f29;--panel2:#202835;--line:#303947;--text:#f2f4f7;--muted:#9ba6b5;--yellow:#f2bd4b;--green:#53c58b;--red:#ef7373;--blue:#79a9f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:244px;background:#151a22;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 9px 24px}.logo{width:38px;height:38px;border-radius:12px;background:var(--yellow);color:#171a20;display:grid;place-items:center;font-size:22px;font-weight:900}.brand b{letter-spacing:1.5px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.navlabel{color:#687486;font-size:10px;font-weight:800;letter-spacing:1.2px;padding:15px 10px 7px}.nav button{width:100%;border:0;background:none;color:#bac3cf;padding:11px 12px;text-align:left;border-radius:9px;margin:2px 0;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#29313d;color:white}.nav button.active{box-shadow:inset 3px 0 var(--yellow)}.ico{width:18px;text-align:center;color:var(--yellow)}
.main{margin-left:244px;width:calc(100% - 244px);padding:28px 34px 50px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{color:var(--muted);font-size:12px}.top h1{font-size:26px;margin:4px 0 0}.user{border:1px solid var(--line);padding:9px 13px;border-radius:12px;color:#cbd3dd;background:var(--panel)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.stat{display:flex;justify-content:space-between;align-items:center}.stat .num{font-size:28px;font-weight:750;margin-top:13px}.stat .sub{color:var(--muted);font-size:12px;margin-top:5px}.stat .symbol{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#303440;color:var(--yellow);font-size:17px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.panel h2{font-size:16px;margin:0 0 16px}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.tag{font-size:11px;padding:5px 8px;border-radius:20px;background:#303744;color:#cbd4df;white-space:nowrap}.tag.green{background:#183c31;color:#7ce0ae}.tag.yellow{background:#493b20;color:#f4ca70}.tag.red{background:#482b30;color:#ff9999}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 16px;flex-wrap:wrap}.search{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;min-width:220px;outline:none}.btn{border:0;background:var(--yellow);color:#1c1d20;font-weight:750;padding:10px 15px;border-radius:10px}.btn.secondary{background:#303947;color:#e7ebf0;border:1px solid #3b4655}.btn.danger{background:#512e32;color:#ffb0b0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);font-weight:650;background:#1c232e}td{font-size:13px}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:30px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#111720;border:1px solid #394453;border-radius:9px;padding:10px;color:var(--text);outline:none}.field textarea{min-height:75px;resize:vertical}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalback.show{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 20px 80px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.x{background:none;border:0;color:var(--muted);font-size:22px}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{border:1px solid #64502a;background:#302719;color:#f4d48b;padding:12px 14px;border-radius:11px;font-size:12px;margin-bottom:17px}.hidden{display:none!important}.money{font-variant-numeric:tabular-nums}.mobilehead{display:none}
@media(max-width:900px){.side{width:70px;padding:16px 8px}.brand{padding:4px 8px 20px}.brand div:last-child,.navlabel,.nav button span:last-child{display:none}.nav button{justify-content:center;padding:12px 4px}.main{margin-left:70px;width:calc(100% - 70px);padding:22px 18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){.main{padding:18px 12px}.top h1{font-size:21px}.user{font-size:11px}.cards{gap:8px}.card{padding:13px}.stat .num{font-size:23px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.search{min-width:0;flex:1}.toolbar{align-items:stretch}.toolbar .btn{white-space:nowrap}.side{width:58px}.main{margin-left:58px;width:calc(100% - 58px)}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><div class="logo">♞</div><div><b>BUNNY BIKE</b><small>Management system</small></div></div>
 <nav class="nav" id="nav">
  <div class="navlabel">ГЛАВНОЕ</div>
  <button class="active" data-page="dashboard"><span class="ico">▦</span><span>Обзор</span></button>
  <button data-page="bikes"><span class="ico">▣</span><span>Велосипеды</span></button>
  <button data-page="clients"><span class="ico">♙</span><span>Клиенты</span></button>
  <button data-page="rentals"><span class="ico">↔</span><span>Аренда</span></button>
  <button data-page="payments"><span class="ico">₽</span><span>Платежи</span></button>
  <div class="navlabel">ОБСЛУЖИВАНИЕ</div>
  <button data-page="repairs"><span class="ico">⚒</span><span>Ремонт</span></button>
  <button data-page="parts"><span class="ico">▤</span><span>Склад и запчасти</span></button>
  <button data-page="expenses"><span class="ico">−</span><span>Расходы</span></button>
  <div class="navlabel">УПРАВЛЕНИЕ</div>
  <button data-page="staff"><span class="ico">♧</span><span>Сотрудники</span></button>
  <button data-page="settings"><span class="ico">⚙</span><span>Настройки</span></button>
 </nav>
</aside>
<main class="main">
 <div class="top"><div><div class="eyebrow">Bunny Bike / <span id="crumb">Обзор</span></div><h1 id="title">Обзор бизнеса</h1></div><div class="user">● Администратор</div></div>
 <div id="content"></div>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Добавить</h2><button class="x" onclick="closeModal()">×</button></div><form id="modalForm"><div class="formgrid" id="formFields"></div><div class="modalactions"><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" type="submit">Сохранить</button></div></form></div></div>
<script>
const STORE='bunnybike_crm_v1';
const initial={bikes:[{id:'BB-001',model:'Wenbox U2 Pro',battery:'60 В / 42 А·ч',status:'Свободен',price:5000,note:'Основной парк'},{id:'BB-002',model:'Wenbox U2 Pro',battery:'60 В / 42 А·ч',status:'В аренде',price:5500,note:''},{id:'BB-003',model:'Wenbox U2 Pro',battery:'60 В / 50 А·ч',status:'Ремонт',price:5000,note:'Проверить контроллер'}],clients:[{name:'Иван Петров',phone:'+7 900 000-00-01',deposit:'Да',note:'Тестовая запись'},{name:'Алексей Смирнов',phone:'+7 900 000-00-02',deposit:'Нет',note:''}],rentals:[{client:'Иван Петров',bike:'BB-002',start:today(),end:addDays(today(),7),price:5500,status:'Активна',paid:5500,deposit:3000}],payments:[],repairs:[{bike:'BB-003',issue:'Диагностика контроллера',status:'В работе',cost:0}],parts:[],expenses:[],staff:[{name:'Администратор',role:'Владелец',phone:''}]};
let db=load();
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(initial)}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function rub(n){return (Number(n)||0).toLocaleString('ru-RU')+' ₽'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let page='dashboard',search='';
const titles={dashboard:'Обзор бизнеса',bikes:'Велосипеды',clients:'Клиенты',rentals:'Аренда',payments:'Платежи',repairs:'Ремонт',parts:'Склад и запчасти',expenses:'Расходы',staff:'Сотрудники',settings:'Настройки'};
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;search='';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function render(){document.getElementById('title').textContent=titles[page];document.getElementById('crumb').textContent=titles[page];let c=document.getElementById('content');c.innerHTML=({dashboard:dashboard,bikes:()=>listPage('bikes'),clients:()=>listPage('clients'),rentals:()=>listPage('rentals'),payments:()=>listPage('payments'),repairs:()=>listPage('repairs'),parts:()=>listPage('parts'),expenses:()=>listPage('expenses'),staff:()=>listPage('staff'),settings:settings})[page]();wireSearch()}
function dashboard(){let active=db.rentals.filter(x=>x.status==='Активна').length,free=db.bikes.filter(x=>x.status==='Свободен').length,repair=db.bikes.filter(x=>x.status==='Ремонт').length,rev=db.payments.reduce((s,x)=>s+Number(x.amount||0),0),overdue=db.rentals.filter(x=>x.status==='Активна'&&x.end<today()).length;
return `<div class="notice">Это локальная демонстрационная версия. Данные сохраняются в браузере на этом устройстве. Для совместной работы сотрудников потребуется подключить серверную базу данных и авторизацию.</div>
<div class="cards">${stat('Велосипеды',db.bikes.length,'В парке','▣')}${stat('В аренде',active,'Активные договоры','↔')}${stat('Свободны',free,'Готовы к выдаче','✓')}${stat('В ремонте',repair,'Требуют внимания','⚒')}</div>
<div class="cards">${stat('Получено оплат',rub(rev),'По журналу платежей','₽')}${stat('Клиенты',db.clients.length,'В базе','♙')}${stat('Просроченные',overdue,'Период аренды истёк','!')}${stat('Расходы',rub(db.expenses.reduce((s,x)=>s+Number(x.amount||0),0)),'Зарегистрировано','−')}</div>
<div class="grid2"><section class="panel"><h2>Текущая аренда</h2>${db.rentals.filter(x=>x.status==='Активна').slice(0,5).map(x=>`<div class="row"><div><b>${esc(x.client)}</b><div class="muted">${esc(x.bike)} · до ${esc(x.end)}</div></div><span class="tag ${x.end<today()?'red':'green'}">${x.end<today()?'Просрочена':'Активна'}</span></div>`).join('')||'<div class="empty">Активных аренд пока нет</div>'}</section><section class="panel"><h2>Быстрые действия</h2><div class="row"><span>Добавить велосипед</span><button class="btn secondary" onclick="openAdd('bikes')">Добавить</button></div><div class="row"><span>Новый клиент</span><button class="btn secondary" onclick="openAdd('clients')">Добавить</button></div><div class="row"><span>Оформить аренду</span><button class="btn" onclick="openAdd('rentals')">Создать</button></div></section></div>`}
function stat(name,num,sub,icon){return `<div class="card"><div class="stat"><span class="muted">${name}</span><span class="symbol">${icon}</span></div><div class="num">${num}</div><div class="sub">${sub}</div></div>`}
const configs={
bikes:{label:'велосипед',button:'Добавить велосипед',fields:[['id','ID велосипеда','text',true],['model','Модель','text',true],['battery','Аккумулятор','text'],['status','Статус','select',['Свободен','В аренде','Ремонт','Списан']],['price','Цена за неделю, ₽','number'],['note','Примечание','text']],cols:[['id','ID'],['model','Модель'],['battery','Аккумулятор'],['status','Статус'],['price','Ставка / нед.']]},
clients:{label:'клиента',button:'Добавить клиента',fields:[['name','ФИО','text',true],['phone','Телефон','text',true],['deposit','Залог','select',['Не определён','Да','Нет']],['note','Примечание','text']],cols:[['name','Клиент'],['phone','Телефон'],['deposit','Залог'],['note','Примечание']]},
rentals:{label:'аренду',button:'Оформить аренду',fields:[['client','Клиент','client',true],['bike','Велосипед','bike',true],['start','Начало аренды','date',true],['end','Оплачено до','date',true],['price','Цена за неделю, ₽','number',true],['deposit','Залог, ₽','number'],['status','Статус','select',['Активна','Завершена','Отменена']]],cols:[['client','Клиент'],['bike','Велосипед'],['start','Начало'],['end','Оплачено до'],['price','Неделя'],['status','Статус']]},
payments:{label:'платёж',button:'Добавить платёж',fields:[['date','Дата','date',true],['client','Клиент','client',true],['rental','ID / велосипед','text'],['amount','Сумма, ₽','number',true],['method','Способ','select',['Наличные','Перевод']],['type','Назначение','select',['Аренда','Залог','Возврат залога','Прочее']],['note','Комментарий','text']],cols:[['date','Дата'],['client','Клиент'],['rental','Аренда'],['amount','Сумма'],['method','Способ'],['type','Назначение']]},
repairs:{label:'заявку на ремонт',button:'Новая заявка',fields:[['bike','Велосипед','bike',true],['issue','Неисправность','text',true],['status','Статус','select',['Новая','В работе','Ожидает запчасти','Готово']],['cost','Стоимость, ₽','number'],['date','Дата','date'],['note','Комментарий','text']],cols:[['bike','Велосипед'],['issue','Неисправность'],['status','Статус'],['cost','Стоимость'],['date','Дата']]},
parts:{label:'позицию склада',button:'Добавить запчасть',fields:[['name','Название','text',true],['sku','Артикул','text'],['qty','Количество','number',true],['min','Минимальный остаток','number'],['price','Цена за единицу, ₽','number'],['note','Примечание','text']],cols:[['name','Запчасть'],['sku','Артикул'],['qty','Остаток'],['min','Мин. остаток'],['price','Цена']]},
expenses:{label:'расход',button:'Добавить расход',fields:[['date','Дата','date',true],['category','Категория','select',['Ремонт','Запчасти','Зарплата','Транспорт','Прочее']],['amount','Сумма, ₽','number',true],['note','Комментарий','text']],cols:[['date','Дата'],['category','Категория'],['amount','Сумма'],['note','Комментарий']]},
staff:{label:'сотрудника',button:'Добавить сотрудника',fields:[['name','ФИО','text',true],['phone','Телефон','text'],['role','Роль','select',['Администратор','Менеджер','Механик']],['note','Примечание','text']],cols:[['name','Сотрудник'],['phone','Телефон'],['role','Роль'],['note','Примечание']]}
};
function listPage(key){let cfg=configs[key],arr=db[key]||[],q=search.toLowerCase(),filtered=arr.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));
let add=`<button class="btn" onclick="openAdd('${key}')">＋ ${cfg.button}</button>`;
let rows=filtered.map((x,i)=>`<tr>${cfg.cols.map(([k,l])=>`<td>${k==='price'||k==='amount'||k==='cost'?rub(x[k]):k==='status'?`<span class="tag ${x[k]==='Активна'||x[k]==='Свободен'||x[k]==='Готово'?'green':x[k]==='Ремонт'||x[k]==='В работе'?'yellow':''}">${esc(x[k]||'—')}</span>`:esc(x[k]||'—')}</td>`).join('')}<td><button class="btn secondary" style="padding:6px 9px" onclick="removeItem('${key}',${i})">Удалить</button></td></tr>`).join('');
return `<div class="toolbar"><input class="search" id="search" placeholder="Поиск..." value="${esc(search)}"><div>${add}</div></div><div class="tablewrap"><table><thead><tr>${cfg.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Действие</th></tr></thead><tbody>${rows||`<tr><td colspan="${cfg.cols.length+1}" class="empty">Пока нет записей</td></tr>`}</tbody></table></div>`}
function wireSearch(){let s=document.getElementById('search');if(s)s.addEventListener('input',e=>{search=e.target.value;let pos=s.selectionStart;render();let ns=document.getElementById('search');ns.focus();ns.setSelectionRange(pos,pos)})}
function settings(){return `<div class="notice">Текущая бизнес-логика: RUB · понедельная аренда · предоплата за период · индивидуальная ставка · залог по ситуации.</div><section class="panel"><h2>Настройки системы</h2><div class="row"><span>Валюта</span><b>Российский рубль (₽)</b></div><div class="row"><span>Стандартный период</span><b>7 дней</b></div><div class="row"><span>Оплата</span><b>Авансом за следующий период</b></div><div class="row"><span>Продление</span><b>Автоматическое создание периода</b></div><div class="row"><span>Стоимость</span><b>Индивидуальная</b></div><div class="row"><span>Хранение</span><b>Локально в этом браузере</b></div><div class="row"><button class="btn secondary" onclick="exportData()">Экспортировать резервную копию JSON</button><button class="btn danger" onclick="resetData()">Сбросить демоданные</button></div></section><p class="muted" style="font-size:12px;margin-top:15px">Для реальной совместной работы нескольких сотрудников подключим облачную PostgreSQL-базу, вход по аккаунтам и серверные права доступа. Не храните реальные паспортные данные в этой тестовой версии.</p>`}
function openAdd(key){let cfg=configs[key];document.getElementById('modalTitle').textContent=cfg.button;let fields=document.getElementById('formFields');fields.innerHTML=cfg.fields.map(([name,label,type,req])=>{let input='';if(type==='select'){input=`<select name="${name}">${typeOptions(cfg,name).map(v=>`<option>${esc(v)}</option>`).join('')}</select>`}else if(type==='client'){input=`<select name="${name}">${db.clients.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`}else if(type==='bike'){input=`<select name="${name}">${db.bikes.filter(x=>x.status==='Свободен'||key!=='rentals').map(x=>`<option>${esc(x.id)}</option>`).join('')}</select>`}else{input=`<input name="${name}" type="${type}" ${req?'required':''} ${name==='start'?'value="'+today()+'"':''} ${name==='end'?'value="'+addDays(today(),7)+'"':''} ${name==='date'?'value="'+today()+'"':''} ${name==='price'&&key==='rentals'?'value="5000"':''} ${name==='status'?'':''}>`}return `<div class="field ${type==='text'&&name==='note'?'full':''}"><label>${label}${req?' *':''}</label>${input}</div>`}).join('');
document.getElementById('modalForm').dataset.key=key;document.getElementById('modalback').classList.add('show')}
function typeOptions(cfg,name){return cfg.fields.find(f=>f[0]===name)?.[3] instanceof Array?cfg.fields.find(f=>f[0]===name)[3]:[]}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();let key=e.currentTarget.dataset.key,data=Object.fromEntries(new FormData(e.currentTarget).entries());if(key==='rentals'){data.paid=0;data.status=data.status||'Активна';let bike=db.bikes.find(x=>x.id===data.bike);if(bike)bike.status='В аренде';}if(key==='payments'){db.payments.push(data);if(data.type==='Аренда'){let r=db.rentals.find(x=>x.client===data.client&&(x.bike===data.rental||data.rental===''));if(r){r.paid=Number(r.paid||0)+Number(data.amount);}}}else db[key].push(data);
if(key==='repairs'){let b=db.bikes.find(x=>x.id===data.bike);if(b)b.status='Ремонт'}
if(key==='expenses')data.amount=Number(data.amount);
if(key==='parts'){data.qty=Number(data.qty);data.min=Number(data.min);data.price=Number(data.price)}
if(key==='bikes')data.price=Number(data.price);
save();closeModal();render()});
function removeItem(key,i){if(!confirm('Удалить эту запись?'))return;let x=db[key][i];db[key].splice(i,1);if(key==='rentals'){let b=db.bikes.find(b=>b.id===x.bike);if(b&&b.status==='В аренде')b.status='Свободен'}save();render()}
function exportData(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='bunny-bike-backup.json';a.click();URL.revokeObjectURL(url)}
function resetData(){if(confirm('Вернуть демонстрационные данные? Текущие записи будут заменены.')){db=structuredClone(initial);save();render()}}
render();
</script>
</body></html>
